# Optional profile for the official APISIX 3.21 Ubuntu image; Kubernetes 1.20+.
# Review UID/GID and writable plugin paths before applying to an existing release.
runtimeVolumes:
  enabled: true
podSecurityContext:
  fsGroup: 636
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  runAsUser: 636
  runAsGroup: 636
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
initContainer:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 636
    runAsGroup: 636
serviceAccount:
  automountServiceAccountToken: false
