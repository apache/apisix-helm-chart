{{- if .Values.autoscaling.enabled }}
{{- if .Values.useDaemonSet -}}
{{- fail "autoscaling requires a Deployment, not useDaemonSet=true" -}}
{{- end -}}
{{- if or (lt (int .Values.autoscaling.minReplicas) 1) (lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas)) -}}
{{- fail "autoscaling requires 1 <= minReplicas <= maxReplicas" -}}
{{- end -}}
{{- if not .Values.autoscaling.metrics -}}
{{- $requests := .Values.resources.requests | default dict -}}
{{- if or (and .Values.autoscaling.targetCPUUtilizationPercentage (not $requests.cpu)) (and .Values.autoscaling.targetMemoryUtilizationPercentage (not $requests.memory)) -}}
{{- fail "utilization autoscaling requires resources.requests for every targeted CPU/memory resource" -}}
{{- end -}}
{{- if not (or .Values.autoscaling.targetCPUUtilizationPercentage .Values.autoscaling.targetMemoryUtilizationPercentage) -}}
{{- fail "autoscaling requires at least one metric" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.autoscaling.behavior (ne .Values.autoscaling.version "v2") -}}
{{- fail "autoscaling.behavior requires autoscaling.version=v2" -}}
{{- end }}

apiVersion: autoscaling/{{ .Values.autoscaling.version }}
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "apisix.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "apisix.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- with .Values.autoscaling.behavior }}
  behavior: {{- toYaml . | nindent 4 }}
  {{- end }}
  metrics:
  {{- if .Values.autoscaling.metrics }}
    {{- toYaml .Values.autoscaling.metrics | nindent 4 }}
  {{- else }}
  {{- if eq .Values.autoscaling.version "v2" }}
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}

    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}

  {{- else }}

    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}

  {{- end}}
  {{- end }}
{{- end }}
