#
# GatewayProxy for the bundled ingress controller. Only this chart knows the
# Admin API Service name and where the admin key is stored, so it creates the
# GatewayProxy instead of the controller chart. Apart from the provider service
# and auth, the fields follow charts/apisix-ingress-controller/templates/gatewayproxy.yaml
# and are read from ingress-controller.gatewayProxy; keep the two in sync.
{{- if include "apisix.ingressController.gatewayProxy.enabled" . }}
{{- $gp := (index .Values "ingress-controller").gatewayProxy }}
{{- $source := include "apisix.admin.credentials.source" (dict "role" "admin" "context" $) }}
apiVersion: apisix.apache.org/v1alpha1
kind: GatewayProxy
metadata:
  name: {{ include "apisix.ingressController.gatewayProxy.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
spec:
  provider:
    type: ControlPlane
    controlPlane:
      service:
        name: {{ include "apisix.fullname" . }}-admin
        port: {{ .Values.apisix.admin.servicePort }}
      {{- with $gp.provider.controlPlane.tlsVerify }}
      tlsVerify: {{ . }}
      {{- end }}
      auth:
        type: AdminKey
        adminKey:
          {{- if eq $source "inline" }}
          value: {{ .Values.apisix.admin.credentials.admin | quote }}
          {{- else if eq $source "secret" }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.apisix.admin.credentials.secretName }}
              key: {{ include "apisix.admin.credentials.secretAdminKey" . }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ include "apisix.admin.credentials.generatedSecretName" . }}
              key: admin
          {{- end }}

  {{- with $gp.publishService }}
  publishService: {{ . | quote }}
  {{- end }}

  {{- with $gp.statusAddress }}
  statusAddress:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $gp.plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $gp.pluginMetadata }}
  pluginMetadata:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
