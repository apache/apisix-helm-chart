{{- define "apisix.admin.credentials.secret" -}}
{{- if and .Values.apisix.admin.enabled (not .Values.apisix.admin.credentials.secretName) }}
{{- $name := include "apisix.admin.credentials.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin: {{ if $existing }}{{ index $existing.data "admin" | b64dec | quote }}{{ else }}{{ default (randAlphaNum 32) .Values.apisix.admin.credentials.admin | quote }}{{ end }}
  viewer: {{ if $existing }}{{ index $existing.data "viewer" | b64dec | quote }}{{ else }}{{ default (randAlphaNum 32) .Values.apisix.admin.credentials.viewer | quote }}{{ end }}
{{- end }}
{{- end }}

{{- if eq .Values.apisix.deployment.mode "decoupled" }}
{{- if .Values.apisix.deployment.controlPlane.enabled }}
{{ include "apisix.admin.credentials.secret" (merge (dict "componentRole" "control_plane" "componentName" "control-plane") .) }}
{{- end }}
{{- else }}
{{ include "apisix.admin.credentials.secret" . }}
{{- end }}
