{{- if and .Values.metrics.serviceMonitor.enabled .Values.apisix.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.metrics.serviceMonitor.name | default (include "apisix.fullname" .) }}
  namespace: {{ .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
    {{- if .Values.metrics.serviceMonitor.labels }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.metrics.serviceMonitor.annotations }}
  annotations: {{- toYaml .Values.metrics.serviceMonitor.annotations | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
    - {{ .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "apisix.labels" . | nindent 6 }}
      app.kubernetes.io/service: apisix-prometheus-metrics
  endpoints:
  - scheme: http
    targetPort: prometheus
    path: {{ .Values.apisix.prometheus.path }}
    interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}

{{- end }}

{{- if eq .Values.apisix.deployment.mode "decoupled" }}
{{- if .Values.apisix.deployment.dataPlane.enabled }}
{{ include "apisix.service.monitor" (merge (dict "componentRole" "data_plane" "componentName" "data-plane") .) }}
{{- end }}
{{- else }}
{{ include "apisix.service.monitor" . }}
{{- end }}
