{{- if (.Values.podDisruptionBudget.enabled) }}
{{ if semverCompare "<1.21-0" .Capabilities.KubeVersion.Version -}}
apiVersion: policy/v1beta1
{{- else -}}
apiVersion: policy/v1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "apisix.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
spec:
{{- if ne (toString .Values.podDisruptionBudget.minAvailable) "" }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
{{- else if ne (toString .Values.podDisruptionBudget.maxUnavailable) "" }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
{{- else }}
  maxUnavailable: 1
{{- end }}
  selector:
    matchLabels:
{{- include "apisix.selectorLabels" . | nindent 6 }}
{{- end }}

{{- end }}

{{- if eq .Values.apisix.deployment.mode "decoupled" }}
{{- if .Values.apisix.deployment.controlPlane.enabled }}
{{ include "apisix.pdb" (merge (dict "componentRole" "control_plane" "componentName" "control-plane") .) }}
{{- end }}
{{- if .Values.apisix.deployment.dataPlane.enabled }}
{{ include "apisix.pdb" (merge (dict "componentRole" "data_plane" "componentName" "data-plane") .) }}
{{- end }}
{{- else }}
{{ include "apisix.pdb" . }}
{{- end }}
