name: CI

on:
  pull_request:
    branches:
      - "*"

  push:

jobs:

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s: ["v1.23.17@sha256:14d0a9a892b943866d7e6be119a06871291c517d279aedb816a4b4bc0ec0a5b3", "v1.22.15@sha256:7d9708c4b0873f0fe2e171e2b1b7f45ae89482617778c1c875f1053d4cef2e41"]

    steps:

      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Lint
        run: |
          docker run --rm --interactive --network host \
              --name ct-lint \
              --volume $PWD:/workdir \
              --workdir /workdir/charts/apisix \
              quay.io/helmpack/chart-testing:v3.13.0 sh -c 'helm dependency update \
               && cd ../.. \
               && helm repo add bitnami https://charts.bitnami.com/bitnami \
               && helm repo add apisix https://apache.github.io/apisix-helm-chart \
               && ct lint \
                  --validate-maintainers=false \
                  --charts charts/apisix \
                  --charts charts/apisix-dashboard \
                  --charts charts/apisix-ingress-controller'

      - name: fix permissions
        run: |
          sudo mkdir -p $HOME/.kube
          sudo chmod -R 777 $HOME/.kube

      - name: Create Kubernetes ${{ matrix.k8s }} cluster
        id: kind
        uses: ./.github/actions/setup-kind
        with:
          version: v0.22.0
          config: test/e2e/kind.yaml
          image: kindest/node:${{ matrix.k8s }}

      - name: Test
        env:
          KIND_CLUSTER_NAME: kind
          SKIP_CLUSTER_CREATION: true
        run: |
          kind get kubeconfig > $HOME/.kube/kind-config-kind
          docker run --rm --interactive --network host \
              --name ct \
              --volume $HOME/.kube/kind-config-kind:/root/.kube/config \
              --volume $PWD:/workdir \
              --workdir /workdir/charts/apisix \
              quay.io/helmpack/chart-testing:v3.13.0 sh -c 'helm dependency update \
               && cd ../.. \
               && helm repo add bitnami https://charts.bitnami.com/bitnami \
               && helm repo add apisix https://apache.github.io/apisix-helm-chart \
               && ct install \
                  --charts charts/apisix'

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.19.2'

      - name: Run helm-docs
        run: |
          GOBIN=$PWD GO111MODULE=on go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.0
          ./helm-docs --chart-search-root=${GITHUB_WORKSPACE}/charts
          DIFF=$(git diff ${GITHUB_WORKSPACE}/charts/**/*md)
          if [ ! -z "$DIFF" ]; then
            echo "Please use helm-docs in your clone, of your fork, of the project, and commit a updated README.md for the chart."
          fi
          git diff --exit-code
          rm -f ./helm-docs

  admin-credentials:
    name: Admin API credentials (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm: v3.22.1
            sha256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
          - helm: v4.2.4
            sha256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
    steps:

      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Install Helm ${{ matrix.helm }}
        run: |
          curl -fsSLO https://get.helm.sh/helm-${{ matrix.helm }}-linux-amd64.tar.gz
          echo "${{ matrix.sha256 }}  helm-${{ matrix.helm }}-linux-amd64.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf helm-${{ matrix.helm }}-linux-amd64.tar.gz -C "$RUNNER_TEMP/helm"
          echo "HELM=$RUNNER_TEMP/helm/linux-amd64/helm" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/helm/linux-amd64/helm" version --short

      - name: Build chart dependencies
        run: |
          "$HELM" repo add bitnami https://charts.bitnami.com/bitnami
          "$HELM" repo add apisix https://apache.github.io/apisix-helm-chart
          "$HELM" dependency build charts/apisix

      - name: Render tests
        run: test/render/admin-credentials.sh

      - name: Create Kubernetes cluster
        uses: ./.github/actions/setup-kind
        with:
          version: v0.33.0
          image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

      - name: End-to-end tests
        run: test/e2e/admin-credentials.sh
